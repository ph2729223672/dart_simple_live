name: Build simple_live_console EXE

on:
  push:
    branches: [ master ]
  workflow_dispatch:  # 支持网页手动点运行

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: simple_live_console

    steps:
      - uses: actions/checkout@v4

      # 1. 安装Visual Studio构建工具，编译dart_quickjs的C代码必须
      - name: Install MSVC Build Tools
        uses: ilammy/msvc-dev-cmd@v1

      # 2. 安装Dart SDK
      - uses: dart-lang/setup-dart@v1

      - name: dart pub get
        run: dart pub get

      # ✅ 使用 dart build cli，替代旧 dart compile exe
      - name: Build native cli exe
        run: dart build cli bin/simple_live_console.dart --output simple_live_console.exe

      # 打包产物：dart build会生成一个文件夹，里面包含exe+必须的dll，不能只单独上传exe！
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_console-windows
          path: simple_live_console/build/cli/
