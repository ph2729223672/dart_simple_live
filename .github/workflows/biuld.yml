name: Build Simple Live App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许网页手动点击运行

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 安装 Flutter 环境（该项目是 Flutter 跨平台项目）
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # 使用最新的 stable 3.x 版本
          channel: 'stable'
          cache: true

      # 进入 simple_live_app 目录并编译 Windows 桌面端
      - name: Build Windows App
        run: |
          cd simple_live_app
          flutter pub get
          flutter build windows --release

      # 打包编译好的产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-windows-exe
          path: simple_live_app/build/windows/x64/runner/Release/
