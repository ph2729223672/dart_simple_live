name: Build Dart to EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许你在网页上手动点击运行

jobs:
  build:
    runs-on: windows-latest # 使用 Windows 环境来编译 exe 最稳妥

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'

      - name: Install dependencies
        run: dart pub get

      - name: Build EXE
        # 请根据项目里实际的主程序入口文件路径修改，比如 bin/main.dart 或 lib/main.dart
        # 如果项目根目录有 pubspec.yaml 并且通过 bin/ 运行，请看下一步说明
        run: dart compile exe bin/main.dart -o dart_simple_live.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dart_simple_live.exe
